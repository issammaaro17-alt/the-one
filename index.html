<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جنان الورد 🌹</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; font-family: sans-serif; }
  #garden {
    position:relative; width:100%; height:100%;
    background: linear-gradient(#2a0a1f 0%, #5c1a3d 60%, #3b1a12 100%);
    cursor: pointer; user-select:none; -webkit-tap-highlight-color: transparent;
  }
  #ground { position:absolute; left:0; right:0; bottom:0; height:14%; background:#2b160e; }
  #hint {
    position:absolute; top:14%; left:0; right:0; text-align:center; color:#ffd6e7;
    font-size:1.4rem; font-weight:bold; transition:opacity .6s; padding:0 20px;
  }
  #count {
    position:absolute; top:12px; left:16px; color:#ffb3d1; font-size:1rem; direction:ltr;
  }
  #msg {
    position:absolute; left:50%; top:40%; transform:translate(-50%,-50%) scale(.8);
    background:#fff0f5; color:#d63384; border-radius:20px; padding:24px 28px;
    text-align:center; font-size:1.3rem; font-weight:bold; width:80%; max-width:360px;
    box-shadow:0 10px 40px rgba(0,0,0,.4); opacity:0; pointer-events:none;
    transition:opacity .8s, transform .8s; z-index:50;
  }
  #msg.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  .rose { position:absolute; pointer-events:none; }
  .stem, .leafL, .leafR, .bloom { transform-box: fill-box; }
  .stem { transform-origin:50% 100%; animation: grow .7s ease-out forwards; }
  .leafL, .leafR { transform:scale(0); animation: pop .4s ease-out .45s forwards; }
  .leafL { transform-origin:100% 50%; }
  .leafR { transform-origin:0% 50%; }
  .bloom { transform-origin:50% 50%; transform:scale(0); animation: bloom .7s cubic-bezier(.3,1.6,.5,1) .6s forwards; }
  @keyframes grow { from { transform:scaleY(0); } to { transform:scaleY(1); } }
  @keyframes pop { to { transform:scale(1); } }
  @keyframes bloom { to { transform:scale(1); } }
</style>
</head>
<body>
<div id="garden">
  <div id="count">0 / 11</div>
  <div id="hint">كليك فالجنان وشوف شنو غيطلع 🌹</div>
  <div id="ground"></div>
  <div id="msg">
    11 ورود فـ 11 🌹<br><br>
    كل وردة فيهم كتقول ليك<br>شحال كنبغيك 💕
  </div>
</div>

<script>
  var garden = document.getElementById("garden");
  var hint = document.getElementById("hint");
  var counter = document.getElementById("count");
  var msg = document.getElementById("msg");
  var n = 0;
  var palettes = [
    ["#d6224a", "#b3153a", "#8a0f2c"],
    ["#e8457c", "#c92f65", "#9c1f4a"],
    ["#ff6b8f", "#e24a73", "#b8325a"],
    ["#c4163f", "#9b1030", "#710a22"],
    ["#f58fb0", "#e06a93", "#b84a72"]
  ];

  function roseSVG(p) {
    var petals = "";
    for (var i = 0; i < 6; i++) {
      petals += '<ellipse cx="30" cy="14" rx="9" ry="13" fill="' + p[0] +
        '" transform="rotate(' + (i * 60) + ' 30 30)"/>';
    }
    return '<svg viewBox="0 0 60 120" width="100%" height="100%">' +
      '<path class="stem" d="M30 50 C28 80 32 100 30 118" stroke="#2e8b3d" stroke-width="3" fill="none" stroke-linecap="round"/>' +
      '<ellipse class="leafL" cx="20" cy="90" rx="10" ry="4.5" fill="#3aa84d" transform="rotate(-30 20 90)"/>' +
      '<ellipse class="leafR" cx="40" cy="74" rx="10" ry="4.5" fill="#3aa84d" transform="rotate(30 40 74)"/>' +
      '<g class="bloom">' + petals +
      '<circle cx="30" cy="30" r="14" fill="' + p[1] + '"/>' +
      '<circle cx="30" cy="30" r="9" fill="' + p[2] + '"/>' +
      '<path d="M24 30a6 6 0 1 1 6 6" stroke="' + p[0] + '" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
      '<path d="M28 30a2.5 2.5 0 1 1 2.5 2.5" stroke="' + p[0] + '" stroke-width="1.4" fill="none" stroke-linecap="round"/>' +
      '</g></svg>';
  }

  function plant(x, y) {
    var s = 0.9 + Math.random() * 0.7;
    var w = 60 * s, h = 120 * s;
    var el = document.createElement("div");
    el.className = "rose";
    el.style.width = w + "px";
    el.style.height = h + "px";
    el.style.left = (x - w / 2) + "px";
    el.style.top = (y - h) + "px";
    el.style.zIndex = Math.round(y);
    el.innerHTML = roseSVG(palettes[Math.floor(Math.random() * palettes.length)]);
    garden.appendChild(el);

    n++;
    counter.textContent = n + " / 11";
    hint.style.opacity = 0;
    if (n === 11) {
      setTimeout(function () { msg.classList.add("show"); }, 1500);
    }
  }

  garden.addEventListener("pointerdown", function (e) {
    var y = Math.max(e.clientY, 130);
    plant(e.clientX, y);
  });
</script>
</body>
</html>
