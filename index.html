<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جنان الورد 🌹</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; font-family: sans-serif; }
  #garden {
    position:relative; width:100%; height:100%;
    background: linear-gradient(#2a0a1f 0%, #5c1a3d 60%, #3b1a12 100%);
    cursor: pointer; user-select:none; -webkit-tap-highlight-color: transparent;
  }
  #ground { position:absolute; left:0; right:0; bottom:0; height:14%; background:#2b160e; }
  #hint {
    position:absolute; top:14%; left:0; right:0; text-align:center; color:#ffd6e7;
    font-size:1.4rem; font-weight:bold; transition:opacity .6s; padding:0 20px;
  }
  #count {
    position:absolute; top:12px; left:16px; color:#ffb3d1; font-size:1rem; direction:ltr;
  }
  #msg {
    position:absolute; left:50%; top:40%; transform:translate(-50%,-50%) scale(.8);
    background:#fff0f5; color:#d63384; border-radius:20px; padding:24px 28px;
    text-align:center; font-size:1.3rem; font-weight:bold; width:80%; max-width:360px;
    box-shadow:0 10px 40px rgba(0,0,0,.4); opacity:0; pointer-events:none;
    transition:opacity .8s, transform .8s; z-index:50;
  }
  #msg.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  .rose { position:absolute; pointer-events:none; }
  .stem, .leafL, .leafR, .bloom { transform-box: fill-box; }
  .stem { transform-origin:50% 100%; animation: grow .7s ease-out forwards; }
  .leafL, .leafR { transform:scale(0); animation: pop .4s ease-out .45s forwards; }
  .leafL, .leafR { transform-origin:0% 50%; }
  .rose svg { overflow:visible; transform-origin:50% 100%; animation: sway var(--sw,4s) ease-in-out 1.5s infinite alternate; }
  @keyframes sway { from { transform:rotate(-2.5deg); } to { transform:rotate(2.5deg); } }
  .bloom { transform-origin:50% 50%; transform:scale(0); animation: bloom .7s cubic-bezier(.3,1.6,.5,1) .6s forwards; }
  @keyframes grow { from { transform:scaleY(0); } to { transform:scaleY(1); } }
  @keyframes pop { to { transform:scale(1); } }
  @keyframes bloom { to { transform:scale(1); } }
  .pf { position:absolute; width:12px; height:14px; pointer-events:none; z-index:60; animation: fall 3s ease-in forwards; }
  @keyframes fall { 0% { transform:translate(0,0) rotate(0); opacity:0; } 15% { opacity:.95; } 100% { transform:translate(var(--dx),110px) rotate(260deg); opacity:0; } }
  .star { position:absolute; border-radius:50%; background:#ffd6e7; pointer-events:none; animation: tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from { opacity:.1; } to { opacity:.8; } }
</style>
</head>
<body>
<div id="garden">
  <div id="count">0 / 11</div>
  <div id="hint">كليك فالجنان وشوف شنو غيطلع 🌹</div>
  <div id="ground"></div>
  <div id="msg">
    11 ورود فـ 11 🌹<br><br>
    كل وردة فيهم كتقول ليك<br>شحال كنبغيك 💕
  </div>
</div>

<script>
  var garden = document.getElementById("garden");
  var hint = document.getElementById("hint");
  var counter = document.getElementById("count");
  var msg = document.getElementById("msg");
  var n = 0;
  var palettes = [
    ["#f0506f", "#c4163f", "#6e0a22"],
    ["#ff9ab5", "#e24a73", "#8f2748"],
    ["#e0304f", "#a30f2f", "#52081a"],
    ["#ffa08a", "#ef5f6b", "#9a2a3c"],
    ["#ffe4ec", "#f4a3bb", "#c25a7b"]
  ];

  function roseSVG(p, id) {
    var ga = "ga" + id, gb = "gb" + id, gc = "gc" + id, gs = "gs" + id, gg = "gg" + id;
    var defs = '<defs>' +
      '<radialGradient id="' + ga + '" cx="50%" cy="100%" r="100%"><stop offset="0" stop-color="' + p[2] + '"/><stop offset=".55" stop-color="' + p[1] + '"/><stop offset="1" stop-color="' + p[0] + '"/></radialGradient>' +
      '<radialGradient id="' + gb + '" cx="50%" cy="100%" r="100%"><stop offset="0" stop-color="' + p[2] + '"/><stop offset=".7" stop-color="' + p[1] + '"/><stop offset="1" stop-color="' + p[0] + '" stop-opacity=".85"/></radialGradient>' +
      '<radialGradient id="' + gc + '" cx="50%" cy="100%" r="100%"><stop offset="0" stop-color="' + p[2] + '"/><stop offset=".6" stop-color="' + p[2] + '"/><stop offset="1" stop-color="' + p[1] + '"/></radialGradient>' +
      '<linearGradient id="' + gs + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#55c068"/><stop offset="1" stop-color="#1c5f2a"/></linearGradient>' +
      '<radialGradient id="' + gg + '"><stop offset="0" stop-color="' + p[0] + '" stop-opacity=".35"/><stop offset="1" stop-color="' + p[0] + '" stop-opacity="0"/></radialGradient>' +
      '</defs>';
    var petal = "M30 31C12 30 7 13 20 7Q24 4 30 5Q36 4 40 7C53 13 48 30 30 31Z";
    var N = 17 + Math.floor(Math.random() * 5), rot0 = Math.random() * 360, k, t, sc, ang, d, tf, grad, petals = "";
    for (k = 0; k < N; k++) {
      t = k / (N - 1);
      sc = (1 - 0.86 * t).toFixed(3);
      ang = ((rot0 + k * 137.5) % 360).toFixed(1);
      d = ((1 - t) * 3.2).toFixed(2);
      tf = "rotate(" + ang + " 30 30) translate(0 -" + d + ") translate(30 30) scale(" + sc + ") translate(-30 -30)";
      grad = t < 0.34 ? ga : (t < 0.68 ? gb : gc);
      petals += '<path d="' + petal + '" fill="#000" opacity=".22" transform="' + tf + ' translate(0 1.6)"/>';
      petals += '<path d="' + petal + '" fill="url(#' + grad + ')" stroke="' + p[2] + '" stroke-opacity=".45" stroke-width=".7" transform="' + tf + '"/>';
      if (t < 0.7) {
        petals += '<path d="M18 9Q30 1 42 9" fill="none" stroke="#fff" stroke-opacity=".26" stroke-width="1.1" stroke-linecap="round" transform="' + tf + '"/>';
      }
    }
    var leaf = "M0 0C5 -8 16 -9 27 0C16 8 5 8 0 0Z";
    var leafTop = "M0 0C5 -8 16 -9 27 0Z";
    var vein = '<path d="M2 0H24M8 0L14 -4M8 0L14 4M15 0L20 -3M15 0L20 3" stroke="#14461e" stroke-opacity=".5" stroke-width=".6" fill="none"/>';
    var lf = '<path d="' + leaf + '" fill="url(#' + gs + ')"/><path d="' + leafTop + '" fill="#fff" opacity=".12"/>' + vein;
    return '<svg viewBox="0 0 60 120" width="100%" height="100%">' + defs +
      '<ellipse cx="30" cy="118" rx="15" ry="3" fill="#000" opacity=".3"/>' +
      '<path class="stem" d="M30 52C27 75 34 95 30 118" stroke="#2a7a38" stroke-width="3.2" fill="none" stroke-linecap="round"/>' +
      '<path class="stem" d="M31 56C29 76 35 95 31 116" stroke="#6bd07d" stroke-opacity=".4" stroke-width="1" fill="none" stroke-linecap="round"/>' +
      '<path class="stem" d="M31.5 90l5.5 -3.5 -5 -2zM28.5 102l-5.5 -3.5 5 -2zM30.5 66l5 -3 -4.5 -2z" fill="#7a3b2e"/>' +
      '<g transform="translate(29.5 96) rotate(200)"><g class="leafL">' + lf + '</g></g>' +
      '<g transform="translate(31 76) rotate(-25)"><g class="leafR">' + lf + '</g></g>' +
      '<g transform="translate(29 62) rotate(215) scale(.55)"><g class="leafL">' + lf + '</g></g>' +
      '<g class="bloom">' +
        '<circle cx="30" cy="30" r="36" fill="url(#' + gg + ')"/>' +
        '<path d="M30 46C22 50 18 56 15 63C23 59 28 55 30 52C32 55 37 59 45 63C42 56 38 50 30 46Z" fill="url(#' + gs + ')"/>' +
        '<path d="M30 48C26 52 24 57 23 62C27 58 29 55 30 53C31 55 33 58 37 62C36 57 34 52 30 48Z" fill="#2f8a41" opacity=".8"/>' +
        petals +
        '<circle cx="30" cy="30" r="2.6" fill="' + p[2] + '"/>' +
        '<path d="M30 30m-2.4 0a2.4 2.4 0 1 1 2.4 2.4M30 30m-5 0a5 5 0 1 1 5 5" stroke="' + p[0] + '" stroke-opacity=".55" stroke-width=".8" fill="none" stroke-linecap="round"/>' +
        '<circle cx="21" cy="17" r="1.7" fill="#fff" opacity=".35"/><circle cx="20.4" cy="16.4" r=".6" fill="#fff" opacity=".9"/>' +
        '<circle cx="39" cy="40" r="1.2" fill="#fff" opacity=".3"/><circle cx="38.6" cy="39.6" r=".45" fill="#fff" opacity=".85"/>' +
      '</g></svg>';
  }

  function plant(x, y) {
    var s = 0.9 + Math.random() * 0.7;
    var w = 60 * s, h = 120 * s;
    var el = document.createElement("div");
    el.className = "rose";
    el.style.width = w + "px";
    el.style.height = h + "px";
    el.style.left = (x - w / 2) + "px";
    el.style.top = (y - h) + "px";
    el.style.zIndex = Math.round(y);
    el.style.setProperty("--sw", (3 + Math.random() * 2).toFixed(1) + "s");
    var pal = palettes[Math.floor(Math.random() * palettes.length)];
    el.innerHTML = roseSVG(pal, n);
    garden.appendChild(el);
    setTimeout(function () { shed(x, y, h, pal[0]); }, 1300);

    n++;
    counter.textContent = n + " / 11";
    hint.style.opacity = 0;
    if (n === 11) {
      setTimeout(function () { msg.classList.add("show"); }, 1500);
    }
  }

  function shed(x, y, h, color) {
    for (var i = 0; i < 3; i++) {
      var f = document.createElement("div");
      f.className = "pf";
      f.style.left = (x + (Math.random() * 28 - 14)) + "px";
      f.style.top = (y - h + 26 + Math.random() * 10) + "px";
      f.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
      f.style.animationDelay = (i * 0.5) + "s";
      f.innerHTML = '<svg viewBox="0 0 10 12" width="12" height="14"><path d="M5 11C0 9 0 3 5 0C10 3 10 9 5 11Z" fill="' + color + '"/></svg>';
      garden.appendChild(f);
      setTimeout(function (el) { el.remove(); }, 4800, f);
    }
  }

  for (var q = 0; q < 28; q++) {
    var st = document.createElement("div");
    var z = 1.5 + Math.random() * 2;
    st.className = "star";
    st.style.cssText = "left:" + (Math.random() * 100) + "%;top:" + (Math.random() * 70) + "%;width:" + z + "px;height:" + z + "px;animation-delay:" + (Math.random() * 3) + "s";
    garden.appendChild(st);
  }

  garden.addEventListener("pointerdown", function (e) {
    var y = Math.max(e.clientY, 130);
    plant(e.clientX, y);
  });
</script>
</body>
</html>
